url: https://github.com/Qiujiyuantiantian/dsh-road-building-materials
name: road-building-materials
category: engineering
description:
  en: >-
    Road building materials as a caliber manual: 60 cards over 12 chapters covering aggregate densities
    and gradation, asphalt indices and the PG system, asphalt-mix volumetric parameters and Marshall mix
    design, cement strength grade and soundness, concrete and mortar proportioning, inorganic-binder
    stabilized mixtures and their 7d strength, steel, polymers, and 35 test procedures. Three direction
    errors would judge non-conforming material as conforming if copied; five worked examples cannot be
    reproduced; two figures were fabricated by OCR with invented coordinates. All are documented.
  zh: >-
    道路建筑材料口径手册：12 章 60 张卡，覆盖集料密度族与级配、沥青指标与 PG 体系、沥青混合料体积参数
    与马歇尔配合比、水泥强度等级与安定性、水泥混凝土与砂浆配合比、无机结合料稳定类与 7d 强度、建筑钢材、
    工程聚合物，以及第二篇 35 个试验方法。三处方向性错误照抄会把不合格材料判成合格；五个算例算不通；
    两处图是 OCR 用凭空坐标捏造的——全部已记录。
